weekly_plans:

id: 1
date_range: "8.1 - 8.7"
英国文学史: "16世纪英国文学（文艺复兴）——斯宾塞、莎士比亚、马洛"
美国文学史: "16世纪美国文学（殖民时期文学）——早期探险文献、印第安叙事"
基础英语: "科技类阅读与翻译（AI、气候变化主题）+ 英汉互译技巧"
政治: "唯物论与辩证法（物质观、意识、三大规律）"
法语: "直陈式现在时（规则/不规则变位）+ 基础词汇（日常、家庭、数字、时间）+ 冠词（定/不定/部分）"

id: 2
date_range: "8.8 - 8.14"
英国文学史: "17世纪英国文学（玄学派、弥尔顿）——多恩、赫伯特、《失乐园》"
美国文学史: "17世纪美国文学（清教文学）——布拉德福德、温思罗普、科顿·马瑟"
基础英语: "人文类阅读与长难句（哲学、历史）——结构拆分与同义改写"
政治: "认识论（实践与认识、真理、价值）"
法语: "复合过去时（avoir/être助动词+过去分词，性数配合）+ 直接/间接宾语代词（me/te/nous/vous/le/la/les/lui/leur）"

id: 3
date_range: "8.15 - 8.21"
英国文学史: "18世纪英国文学（启蒙与小说）——笛福、斯威夫特、菲尔丁"
美国文学史: "18世纪美国文学（革命时期）——富兰克林、潘恩、杰斐逊"
基础英语: "经济类阅读与写作（图表描述、议论文框架）+ 词汇搭配"
政治: "唯物史观（社会基本矛盾、群众史观）"
法语: "未完成过去时（用法与变位）+ 副代词（en/y）+ 关系代词（qui/que/dont/où）+ 指示/主有形容词"

id: 4
date_range: "8.22 - 8.28"
英国文学史: "19世纪早期英国文学（浪漫主义）——华兹华斯、柯勒律治、拜伦"
美国文学史: "19世纪早期美国文学（浪漫主义/超验主义）——爱默生、梭罗、霍桑"
基础英语: "法律/政治类阅读与概要写作 + 翻译长难句综合"
政治: "资本主义与社会主义（剩余价值、当代资本主义、科学社会主义）"
法语: "将来时（简单将来+先将来）+ 条件式现在时（委婉/假设）+ 虚拟式现在时（常见连词与用法）+ 介词（à/de/par/pour等）与状语短语"

id: 5
date_range: "8.29 - 9.4"
英国文学史: "19世纪中期英国文学（维多利亚时期）——狄更斯、勃朗特姐妹、乔治·艾略特"
美国文学史: "19世纪中期美国文学（浪漫主义后期/超验主义深化）——惠特曼、狄金森、霍桑与麦尔维尔"
基础英语: "学术类阅读与逻辑论证（社科论文结构） + 长难句快速切分"
政治: "毛泽东思想（新民主主义革命、社会主义改造）"
法语: "虚拟式现在时（巩固）+ 虚拟式过去时（用法与变位） + 不定式与现在分词（作状语/补语） + 代动词（各时态变位与意义）"

id: 6
date_range: "9.5 - 9.11"
英国文学史: "19世纪晚期英国文学（唯美主义与现实批判）——哈代、王尔德、史蒂文森、吉卜林"
美国文学史: "19世纪晚期美国文学（现实主义与自然主义）——马克·吐温、亨利·詹姆斯、杰克·伦敦、克莱恩"
基础英语: "写作训练（议论文论点展开、摘要写作） + 翻译中文化差异处理"
政治: "中国特色社会主义理论体系（邓小平理论、三个代表、科学发展观、新时代思想）"
法语: "条件式过去时（时态配合+遗憾/责备） + 被动态（各时态） + 副动词（en+现在分词） + 过去分词独立结构（作原因/时间状语）"

id: 7
date_range: "9.12 - 9.18"
英国文学史: "20世纪早期英国文学（现代主义发端）——乔伊斯、伍尔夫、劳伦斯、T.S.艾略特"
美国文学史: "20世纪早期美国文学（意象派、迷惘的一代）——庞德、弗罗斯特、海明威、菲茨杰拉德、福克纳"
基础英语: "综合模拟（完形+阅读+翻译） + 错题归类与高频词汇复盘"
政治: "思想道德修养与法律基础（或当代世界经济与政治核心）——结合当年时政"
法语: "时态配合（过去时态叙事中的直陈式、条件式、虚拟式选择） + 所有代词位置综合（双宾语、en/y、代词顺序） + 关系代词（dont/lequel等） + 介词与动词搭配（à/de/par/pour/avec） + 常用感叹/否定句式总结"
