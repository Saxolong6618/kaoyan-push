name: 考研每日推送
on:
  schedule:
    - cron: '0 8 * * *'   # 北京时间下午4点
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4       # 升级到 v4
      - name: Setup Python
        uses: actions/setup-python@v5   # 升级到 v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Run script
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}   # 使用新的密钥名称
          WECHAT_SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
        run: python daily_push.py
